services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-api
    # HuggingFace's free tier inference endpoints are rate-limited and
    # sometimes flaky; restart on failure so a transient 503 doesn't
    # kill the user-facing experience.
    restart: unless-stopped
    environment:
      HUGGINGFACEHUB_API_TOKEN: ${HUGGINGFACEHUB_API_TOKEN:?set HUGGINGFACEHUB_API_TOKEN in .env}
      FAISS_INDEX_PATH: /app/faiss_local_index
      DEFAULT_K: "4"
      LLM_TEMPERATURE: "0.2"
    volumes:
      # Mount the prebuilt index read-only so the api container can use
      # it without re-embedding. Adjust the left side if you move the
      # index folder.
      - ./faiss_local_index:/app/faiss_local_index:ro
    ports:
      - "7860:7860"
    healthcheck:
      # Cheap probe: doesn't hit the LLM, doesn't hit FAISS beyond what
      # startup already does.
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:7860/health', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-ui
    restart: unless-stopped
    environment:
      # Inside docker-compose, the api service is reachable at this DNS name.
      API_URL: http://api:7860
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
