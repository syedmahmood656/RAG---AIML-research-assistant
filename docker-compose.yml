services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-api
    restart: unless-stopped
    environment:
      # Token is optional: without it the API serves extractive (retrieval-only) answers.
      HUGGINGFACEHUB_API_TOKEN: ${HUGGINGFACEHUB_API_TOKEN:-}
      LLM_REPO_ID: ${LLM_REPO_ID:-meta-llama/Llama-3.1-8B-Instruct}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      FAISS_INDEX_PATH: /app/faiss_local_index
      DEFAULT_K: "4"
      LLM_TEMPERATURE: "0.2"
    volumes:
      - ./faiss_local_index:/app/faiss_local_index:ro
    ports:
      - "7860:7860"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:7860/health', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-ui
    restart: unless-stopped
    environment:
      API_URL: http://api:7860
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
